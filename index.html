<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>J.A.R.V.I.S AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>J.A.R.V.I.S</h1>

        <p class="subtitle">
            PERSONAL AI ASSISTANT
        </p>

        <div class="chat-box">

            <input
                type="text"
                id="userInput"
                placeholder="Ask JARVIS something..."
            >

            <button onclick="askJarvis()">
                ASK
            </button>

            <p id="response">
                JARVIS: Systems online. How can I help?
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
